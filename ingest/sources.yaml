# AGRENSE knowledge-base manifest: starter corpus (compiled 2026-11-12).
# Each URL was located on the publisher's own site. Re-check terms of use before
# redistributing content. The fetcher obeys robots.txt and rate-limits requests.
#
# Sources: TNAU (Tamil Nadu agronomy), PPQS (pesticide approvals + DPPQS/NIPHM IPM packages),
# ICAR (institute production guides), IMD (agromet bulletins, time-limited),
# KVK (KVK-portal packages of practice), SHCP (Soil Health Card / soil health management scheme).

defaults:
  language: en
  state: Tamil Nadu

documents:
